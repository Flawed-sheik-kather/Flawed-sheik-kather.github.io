<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Projects</title>
    <link rel="stylesheet" href="style.css">

<!-- Load an icon library to show a hamburger menu (bars) on small screens -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <div class="topnav" id="myTopnav">
      <a href="#home" class="active">Projects</a>
      <a href="#news">Home</a>
      <a href="#contact">Contact</a>
      <a href="#about">About</a>
      <a href="javascript:void(0);" class="icon" onclick="myFunction()">
        <i class="fa fa-bars"></i>
      </a>
    </div>
</head>
<body class="projects-page">
    
    <!-- Loading Screen -->
<div id="loading">
    <img src="Spamton_loading_cursor.gif" alt="Loading...">
</div>

    <h1>My Projects</h1>
    <p>Here are some of my cybersecurity projects.</p>

<script>
    function navigate(page) {
        document.getElementById("loading").style.display = "flex";

        setTimeout(function () {
            window.location.href = page;
        }, 800); // time for GIF to play
    }
</script>

<button class="button" onclick="navigate('index.html')">Home</button>
    
<script>
    window.addEventListener("load", function () {
        document.getElementById("loading").style.display = "none";
    });
</script>


/* Toggle between adding and removing the "responsive" class to topnav when the user clicks on the icon */
<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
    
</body>
</html>
