<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="projects-page">

    <!-- NAVBAR -->
    <div class="topnav" id="myTopnav">
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Skills</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="index.html#contact">Contact</a>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <img src="Media/Gifs_and_animations/hamburger_menu_bigger.gif" class="hamburger-icon" alt="menu">
        </a>
    </div>

    <!-- PROJECTS -->
    <section class="projects-section">
        <h1 class="hero-name" style="margin-bottom: 40px;">Projects</h1>
        <div class="projects-grid" id="projects-grid">
            <p class="hero-degree" id="loading">Loading projects...</p>
        </div>
    </section>

    <!-- HIRE BAR -->
    <div class="hire-bar">
        <span>Want to hire me?</span>
        <a href="Media/CV/CV.pdf" download="CV.pdf" class="cv-button">Download CV</a>
    </div>

    <script src="script.js"></script>
    <script>
        async function loadProjects() {
            const grid = document.getElementById('projects-grid');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('https://api.github.com/users/Flawed-sheik-kather/repos?sort=updated&per_page=100');
                const repos = await response.json();

                loading.remove();

                repos.forEach(repo => {
                    const card = document.createElement('div');
                    card.classList.add('project-card');

                    card.innerHTML = `
                        <div class="project-card__header">
                            <span class="project-card__name">> ${repo.name.replace(/-/g, ' ')}</span>
                            ${repo.language ? `<span class="project-card__lang">${repo.language}</span>` : ''}
                        </div>
                        <p class="project-card__desc">${repo.description || 'No description provided.'}</p>
                        <div class="project-card__links">
                            <a href="${repo.html_url}" target="_blank" class="cv-button">View on GitHub</a>
                            ${repo.homepage ? `<a href="${repo.homepage}" target="_blank" class="cv-button">Live Demo</a>` : ''}
                        </div>
                    `;

                    grid.appendChild(card);
                });

            } catch (error) {
                loading.textContent = 'Failed to load projects. Please try again later.';
            }
        }

        loadProjects();
    </script>
</body>
</html>
