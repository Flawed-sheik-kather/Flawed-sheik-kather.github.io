<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cybersecurity Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="projects-page">

    <!-- NAVBAR -->
    <div class="topnav" id="myTopnav">
        <a href="projects.html" class="active">Projects</a>
        <a href="index.html">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#skills">Tools & Skills</a>
        <a href="index.html#contact">Contact</a>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <img src="Media/Images/hamburger_menu_bigger.png" alt="Menu" class="hamburger-icon">
        </a>
    </div>

    <!-- PROJECTS -->
    <section class="projects-section">
        <h1 class="hero-name" style="margin-bottom: 60px;">Projects</h1>
        <div id="projects-container">  <!-- ← was projects-grid, now matches the script -->
            <p class="hero-degree" id="loading">Loading projects...</p>
        </div>
    </section>

    <!-- HIRE BAR -->
    <div class="hire-bar">
        <span>Want to hire me?</span>
        <a href="Media/CV/CV.pdf" download="CV.pdf" class="cv-button">Download CV</a>
    </div>

    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");
            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }

        const projectConfig = {
            'Malware_Analysis_AI_Tool_with_explainability': {
                extraDesc: 'Any extra detail you want to add.'
            },
            'Garbage_Detection_AI_app': {
                extraDesc: ''
            },
            'GPA_Calculator_app': {
                extraDesc: ''
            },
            'Flawed-sheik-kather.github.io': {
                extraDesc: ''
            }
        };

        async function loadProjects() {
            const container = document.getElementById('projects-container');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('https://api.github.com/users/Flawed-sheik-kather/repos?sort=updated&per_page=100');
                const repos = await response.json();

                loading.remove();

                repos.forEach((repo, index) => {
                    const config = projectConfig[repo.name] || {};
                    const hasImage = !!config.image;
                    const isReversed = index % 2 !== 0;

                    const section = document.createElement('section');
                    section.classList.add('project-entry');

                    const card = document.createElement('div');
                    card.classList.add('split-card');
                    if (isReversed) card.classList.add('split-card--reverse');
                    if (!hasImage) card.classList.add('split-card--text-only');

                    card.innerHTML = `
                        <div class="split-card__text">
                            <div class="project-entry__header">
                                <span class="hero-name">> ${repo.name.replace(/_/g, ' ').replace(/-/g, ' ')}</span>
                                ${repo.language ? `<span class="project-entry__lang">${repo.language}</span>` : ''}
                            </div>
                            <p class="hero-degree" style="margin-top: 15px;">${repo.description || ''}</p>
                            ${config.extraDesc ? `<p class="hero-degree" style="margin-top: 10px;">${config.extraDesc}</p>` : ''}
                            <div class="project-entry__links">
                                <a href="${repo.html_url}" target="_blank" class="cv-button">View on GitHub</a>
                                ${repo.homepage ? `<a href="${repo.homepage}" target="_blank" class="cv-button">Live Demo</a>` : ''}
                            </div>
                        </div>
                        ${hasImage ? `
                        <div class="split-card__image">
                            <img src="${config.image}" alt="${repo.name}">
                        </div>` : ''}
                    `;

                    section.appendChild(card);
                    container.appendChild(section);
                });

            } catch (error) {
                loading.textContent = 'Error: ' + error.message;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>

</body>
</html>
