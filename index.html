<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cybersecurity Portfolio</title>
    <!-- Pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

    <!-- NAVBAR -->
    <div class="topnav" id="myTopnav">
        <a href="index.html" class="active">Home</a>
        <a href="projects.html">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            <img src="Media/Images/hamburger_menu_bigger.png" alt="Menu" class="hamburger-icon">
        </a>
    </div>

    <!-- HERO SECTION -->
    <section class="hero" id="hero">
        <div class="hero-card">
            <div class="hero-text">
                <h1 class="hero-name">Sheik Kather Fahima</h1>
                <h2 class="hero-degree">BSc (Hons) Cyber Security</h2>
            </div>
            <div class="hero-image">
                <img src="Media/Images/Hero-pic-smaller.jpeg" alt="Your Name">
            </div>
        </div>
    </section>

    <!-- Optional contact section anchor -->
    <section id="contact"></section>

    <!-- JavaScript for hamburger toggle -->
    <script>
        function myFunction() {
            var x = document.getElementById("myTopnav");
            if (x.className === "topnav") {
                x.className += " responsive";
            } else {
                x.className = "topnav";
            }
        }
    </script>
    
</body>
</html>
