<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cybersecurity Portfolio</title>
    <link rel="stylesheet" href="style.css">

<!-- Load an icon library to show a hamburger menu (bars) on small screens -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <div class="topnav" id="myTopnav">
      <a href="index.html" class="active">Home</a>
      <a href="projects.html">Projects</a>
      <a href="#contact">Contact</a>
      <a href="#about">About</a>
      <a href="javascript:void(0);" class="icon" onclick="myFunction()">
        <i class="fa fa-bars"></i>
      </a>
    </div>
    
</head>
<body class="home-page">


<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>

<!-- Loading Screen -->
<div id="loading">
    <img src="Spamton_loading_cursor.gif" alt="Loading...">
</div>

<h1>Hi, I'm a Cybersecurity Graduate</h1>
<p>Welcome to my portfolio website.</p>

<script>
    function navigate(page) {
        document.getElementById("loading").style.display = "flex";

        setTimeout(function () {
            window.location.href = page;
        }, 800); // time for GIF to play
    }
</script>


<button class="button" onclick="navigate('projects.html')">View Projects</button>

    
<script>
    window.addEventListener("load", function () {
        document.getElementById("loading").style.display = "none";
    });
</script>
    
</body>
</html>
