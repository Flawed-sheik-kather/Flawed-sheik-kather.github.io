<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cybersecurity Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

<!-- Loading Screen -->
<div id="loading">
    <img src="Spamton_loading_cursor.gif" alt="Loading...">
</div>

<h1>Hi, I'm a Cybersecurity Graduate</h1>
<p>Welcome to my portfolio website.</p>

<script>
    function navigate(page) {
        document.getElementById("loading").style.display = "flex";

        setTimeout(function () {
            window.location.href = page;
        }, 800); // time for GIF to play
    }
</script>


<button onclick="navigate('projects.html')">View Projects</button>

    
<script>
    window.addEventListener("load", function () {
        document.getElementById("loading").style.display = "none";
    });
</script>
    
</body>
</html>
