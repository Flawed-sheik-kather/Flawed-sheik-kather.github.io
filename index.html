<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cybersecurity Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

<!-- The overlay -->
<div id="myNav" class="overlay">

  <!-- Button to close the overlay navigation -->
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

  <!-- Overlay content -->
  <div class="overlay-content">
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Clients</a>
    <a href="#">Contact</a>
  </div>

</div>

<!-- Use any element to open/show the overlay navigation menu -->
<span onclick="openNav()">open</span>

<!-- Loading Screen -->
<div id="loading">
    <img src="Spamton_loading_cursor.gif" alt="Loading...">
</div>

<h1>Hi, I'm a Cybersecurity Graduate</h1>
<p>Welcome to my portfolio website.</p>

<script>
    function navigate(page) {
        document.getElementById("loading").style.display = "flex";

        setTimeout(function () {
            window.location.href = page;
        }, 800); // time for GIF to play
    }
</script>


<button class="button" onclick="navigate('projects.html')">View Projects</button>

    
<script>
    window.addEventListener("load", function () {
        document.getElementById("loading").style.display = "none";
    });
</script>
    
</body>
</html>
